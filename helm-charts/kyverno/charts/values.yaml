# Values for kyverno umbrella chart
# Values under the "kyverno" key are passed to the subchart
kyverno:
  crds:
    install: true

  # Admission Controller (主策略引擎)
  admissionController:
    replicas: 1
    container:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 384Mi

  # Background Controller (后台扫描)
  backgroundController:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

  # Cleanup Controller (清理策略)
  cleanupController:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

  # Reports Controller (报告生成)
  reportsController:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
