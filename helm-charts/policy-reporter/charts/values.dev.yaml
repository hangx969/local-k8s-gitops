# Dev environment overrides for policy-reporter
policy-reporter:
  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      memory: 256Mi

  # 启用 Policy Reporter UI
  ui:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        memory: 256Mi

  # 启用 Kyverno 插件（集成 Kyverno 策略数据）
  plugin:
    kyverno:
      enabled: true
