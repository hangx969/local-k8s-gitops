# Dev environment overrides for external-secrets
external-secrets:
  image:
    repository: ghcr.io/external-secrets/external-secrets
    pullPolicy: IfNotPresent

  # Resource limits for dev environment
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  certController:
    image:
      repository: ghcr.io/external-secrets/external-secrets
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  webhook:
    image:
      repository: ghcr.io/external-secrets/external-secrets
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
