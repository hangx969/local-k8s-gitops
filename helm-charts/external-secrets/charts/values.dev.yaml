# Dev environment overrides for external-secrets
external-secrets:
  # Use DaoCloud mirror for image pull acceleration
  image:
    repository: m.daocloud.io/ghcr.io/external-secrets/external-secrets
    pullPolicy: IfNotPresent

  # Resource limits for dev environment
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  certController:
    image:
      repository: m.daocloud.io/ghcr.io/external-secrets/external-secrets
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  webhook:
    image:
      repository: m.daocloud.io/ghcr.io/external-secrets/external-secrets
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
